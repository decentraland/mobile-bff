name: node

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_COMPONENT_PSQL_HOST: localhost
      PG_COMPONENT_PSQL_PORT: 5432
      PG_COMPONENT_PSQL_DATABASE: mobile_test
      PG_COMPONENT_PSQL_USER: postgres
      PG_COMPONENT_PSQL_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: install
        run: npm ci
      - name: build
        run: npm run build
      - name: test
        run: npm test
