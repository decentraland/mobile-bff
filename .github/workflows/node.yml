name: node

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - name: install
        run: yarn
      - name: build
        run: yarn build
      - name: test
        run: yarn test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - name: install
        run: yarn
      - name: lint openapi spec
        run: yarn docs:lint
      - name: generate docs
        run: yarn docs:generate
      - name: upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api.html
